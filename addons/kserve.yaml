# KServe's controller — model serving.
#
# PREREQUISITE: cert-manager. KServe's admission webhook needs a certificate, and without one the
# controller comes up and every InferenceService you create is rejected by the API server. There is
# no cert-manager add-on in Alethia's marketplace — cert-manager is part of the platform. A project
# created from the AI Workloads template gets it automatically, on any cloud, with no domain; any
# other project gets it by turning on a managed certificate (a Domain name plus Managed TLS
# certificate on the DNS component — AWS, Google Cloud and Azure). Do not add it here: two things
# installing cert-manager into one cluster fight over the same CRDs, and ArgoCD resolves that by
# flapping.
#
# `deploymentMode: RawDeployment` is the important override. KServe defaults to `Serverless`,
# which requires Knative Serving and an Istio ingress gateway — three more platforms, none of them
# in this template, and an InferenceService that never leaves `Unknown` if they are absent.
# RawDeployment renders a plain Deployment, Service and HPA instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: addons
  source:
    repoURL: oci://ghcr.io/kserve/charts
    chart: kserve
    targetRevision: "v0.15.2"
    helm:
      values: |
        kserve:
          controller:
            deploymentMode: "RawDeployment"
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3

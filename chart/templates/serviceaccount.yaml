{{- if .Values.serviceAccount.create }}
{{/*
THIS RENDERS A RESOURCE THE BYO PROJECT REFUSES, and it is here so that the refusal is explained
rather than merely encountered.

`serviceAccount.create` defaults to false. If you turn it on, Alethia's ArgoCD project blacklists
`ServiceAccount` — the sync fails with a message naming the resource and the Application reports
`Missing`. The chart renders it anyway rather than silently dropping it, because a chart that
quietly ignores a value you set is the harder problem of the two.

It also makes `serviceAccount.create=true` a real mutation, which is what this repository's CI
uses to prove that `hack/check-byo-contract.sh` is still looking. Without this template the chart
rendered the same thing either way, the "must fail" control passed a render it should have
refused, and the run went red naming exactly that — which is the control working.

If a workload here genuinely needs its own identity, an administrator creates the ServiceAccount
out of band and you name it in `serviceAccount.name` with `create: false`. Nothing in this chart
calls the Kubernetes API, so nothing in it needs one.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai.serviceAccountName" . }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
